# Production config, used once a TLS cert exists. deploy.sh copies this into
# deploy/nginx.active.conf (the file actually mounted into the nginx container).

# HTTP -> HTTPS redirect, but let ACME challenges through for cert renewal.
server {
    listen 80;
    server_name laptoptrek.com www.laptoptrek.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name laptoptrek.com www.laptoptrek.com;

    ssl_certificate     /etc/letsencrypt/live/laptoptrek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laptoptrek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LATI chat streams SSE — must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
