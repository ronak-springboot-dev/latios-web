# Production config, used once a TLS cert exists. deploy.sh copies this into
# deploy/nginx.active.conf (the file actually mounted into the nginx container).

# HTTP -> HTTPS redirect, but let ACME challenges through for cert renewal.
server {
    listen 80;
    server_name laptoptrek.com www.laptoptrek.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name laptoptrek.com www.laptoptrek.com;

    ssl_certificate     /etc/letsencrypt/live/laptoptrek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laptoptrek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Session reuse avoids a full handshake per visit. A tower page opens ~100
    # connections' worth of requests, so the CPU saved here is not marginal.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    root /usr/share/nginx/html;

    # --- serving efficiency ------------------------------------------------
    # A single tower page pulls 64 reveal frames plus bands, images and a clip.
    # Without the open-file cache that is ~100 stat()+open() pairs per view, all
    # for files that never change between deploys.
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    open_file_cache          max=2000 inactive=5m;   # 1,165 static files today
    open_file_cache_valid    2m;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # --- compression -------------------------------------------------------
    # Text only. WebP, MP4 and WOFF2 are already compressed; running gzip over
    # them burns CPU to add bytes, which is why they are absent from this list.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json
                      application/manifest+json application/xml
                      image/svg+xml;

    # --- real client IP behind Cloudflare ----------------------------------
    # Only has an effect once the domain is proxied through Cloudflare (orange
    # cloud). Until then these ranges never match and $remote_addr is used as
    # before, so it is safe to leave in place.
    #
    # Without this every request appears to come from a Cloudflare edge IP,
    # which breaks the Turnstile check on /api/enquiries and makes access logs
    # useless. Ranges from cloudflare.com/ips - re-check after major changes.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LATI chat streams SSE — must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- caching -----------------------------------------------------------
    # One Cache-Control header per response, set with add_header alone. Using
    # `expires` as well emits a SECOND Cache-Control, and browsers disagree
    # about which one wins.

    # CRA content-hashes these filenames (main.<hash>.js), so the URL changes
    # whenever the bytes do. Safe to pin for a year.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Generated media. Stable PATHS, changing CONTENT — every model reuses
    # /reveal/<slug>/NNN.webp, and the pipeline rewrites all 960 frames on a
    # rebuild. `immutable` would pin a stale frame in a returning visitor's
    # browser with no way to bust it, so this is a day plus a week of
    # stale-while-revalidate instead. Content-hash these paths and they can
    # join /static/ above.
    location ~* ^/(reveal|videos|bands|images|datasheets|custom-images)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        access_log off;
    }

    # The shell must never be cached, or a deploy ships new hashed bundles that
    # a stale index.html does not reference.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
