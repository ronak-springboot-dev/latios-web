# Bootstrap config used ONLY before a TLS certificate exists (first `./deploy.sh --init` run).
# HTTP only — serves the ACME challenge for Certbot, proxies /api, and serves the
# frontend build, so the site is at least reachable over plain HTTP while the
# cert is being issued. deploy.sh switches to nginx.conf (full HTTPS) right after.

server {
    listen 80;
    server_name laptoptrek.com www.laptoptrek.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LATI chat streams SSE — must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
